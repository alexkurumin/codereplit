A Fundação Cásper Líbero, organizadora, fala em "edição-memória". O pelotão de elite, masculino e feminino, terá premiação dobrada e largada ao pôr do sol, resgatando a antiga corrida noturna. Para o amador, a novidade é o chip comemorativo dourado e a medalha em bronze fundido com fragmentos do asfalto original da primeira prova.

Nas calçadas, a previsão é de 800 mil espectadores. Bares da Augusta estenderão o funcionamento. A CET interditará 38 vias a partir das 4h. Para quem não corre, a dica do jornal é assistir da subida da Consolação: ali, segundo os veteranos, se vê o verdadeiro retrato da Silvestre — o sofrimento bonito de quem prometeu começar o ano correndo.

Foram 15.023 inscritos, segundo a Secretaria de Esportes, divididos em oito currais: de 3:45/km a 7:30/km. A ideia, importada de Chicago e Berlim, funcionou. O funil da Avenida Historiador Rubens de Mendonça, sempre caótico, fluiu. Menos trombadas, menos corredores caminhando na frente de quem queria voar.

A prova, criada em 1984 por padres salesianos, mantém seu charme interiorano. O kit veio com tereré e chip retornável. Na chegada, no Parque das Águas, havia distribuição de manga colhida na chapada e banho de mangueira para as crianças.

A vencedora no feminino, Jéssica dos Santos, 32, dona de casa e mãe de três, correu de chinelo perdido nos últimos 400m. "Meu pace era 6:10. Entreguei 5:58. Valeu o susto", riu. A organização já confirmou: o modelo de largada por ritmo fica.

No Rio, o percurso de 21km resgata trechos fechados desde 2018: Pedra da Gávea pela Carrasqueira e descida pelo Parque Lage com travessia de riacho. A organização exigirá autossuficiência de 7km entre PCs e lanterna obrigatória, mesmo largando de dia. "A neblina desce rápido. Queremos corredor que saiba se virar", explica a diretora de prova, Letícia Brandão.

Em Nova Lima, o destaque é o ganho: 1.800m positivos em 32km, passando por cavas de mineração desativadas e estradões de eucalipto. Haverá categoria Duo — um corre, outro pedala, revezando em pontos marcados.

O ponto fora da curva é ambiental. Cada inscrição planta três mudas nativas e o atleta leva para casa um "passaporte de trilha" para carimbar. O kit não terá camiseta. "Quem precisa de mais uma camisa de poliamida?", provoca Letícia.

Em 2026, nos dias 16 e 17 de maio, o evento terá cinco distâncias — 7km, 16km, 32km, 55km e 75km — todas com largada entre 4h e 6h da manhã, de frontal na cabeça. O percurso rainha, de 75km, acumula 3.200m de ganho e corta o Morro de São Jerônimo, a Casa de Pedra e o temido Areial do Segredo, um trecho de 4km de areia fofa sob sol de 34ºC onde o pace vai a 9:00/km sem vergonha.

"O Senta a Púa não é para RP", avisa o criador, Seu Dito Guimarães, 61, que ainda confere manualmente cada marcação de cal. A prova mantém tradições analógicas: não há fotos com reconhecimento facial, o número é de tecido e o PC do km 38 serve café coado na hora com pão de queijo.

O que mudou foi a estrutura. Haverá base médica com câmara fria para hipertermia e rastreador via satélite obrigatório nos 55km e 75km. Ainda assim, o regulamento mantém a regra de ouro: "Se encontrar lixo na trilha, mesmo que não seja seu, traga. Se não trouxer, está desclassificado".
