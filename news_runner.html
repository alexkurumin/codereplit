O PAULO",subtitle:"Prova mais tradicional da América Latina esgota inscrições em 48h e promete percurso histórico",category:"RUA",date:"31/12/2025",excerpt:"Na manhã do último dia do ano, a Avenida Paulista voltará a ser tomada por um mar de corredores. A organização confirma estrutura recorde e transmissão internacional.",createdAt:Date.now()-345600000,publishedAt:Date.now()-345600000,content:`SÃO PAULO — Cem vezes São Silvestre. A prova que nasceu em 1925 como uma homenagem discreta a um santo e se transformou no maior réveillon esportivo do país chega à sua edição centenária com números que desafiam a própria história. Serão 55.000 corredores largando em ondas entre a Paulista e o centro, num traçado que revisita os primeiros quilômetros de 1925.

A Fundação Cásper Líbero, organizadora, fala em "edição-memória". O pelotão de elite, masculino e feminino, terá premiação dobrada e largada ao pôr do sol, resgatando a antiga corrida noturna. Para o amador, a novidade é o chip comemorativo dourado e a medalha em bronze fundido com fragmentos do asfalto original da primeira prova.

Técnicos apontam que o percurso da Brigadeiro Luís Antônio, com seus 2,1 km de subida contínua, continuará sendo o juiz da prova. "Não é sobre pace perfeito, é sobre gerenciar a euforia", diz o treinador Vanderlei Cordeiro de Lima, que já correu 12 edições.

Nas calçadas, a previsão é de 800 mil espectadores. Bares da Augusta estenderão o funcionamento. A CET interditará 38 vias a partir das 4h. Para quem não corre, a dica do jornal é assistir da subida da Consolação: ali, segundo os veteranos, se vê o verdadeiro retrato da Silvestre — o sofrimento bonito de quem prometeu começar o ano correndo.

Para a 100ª, a organização preparou ainda uma exposição no Conjunto Nacional com fotos das 99 edições anteriores e um livro de 320 páginas. É memória viva, suor impresso em papel jornal.`},{id:"b-corrida-de-reis",title:"CORRIDA DE REIS ESTREIA LARGADA POR PACE E REÚNE 15 MIL EM CUIABÁ",subtitle:"Prova que abre o calendário nacional adota modelo americano e termina com chuva de manga",category:"RUA",date:"12/01/2026",excerpt:"Capital mato-grossense inova ao separar currais por tempo previsto. Largada às 5h30 busca fugir do calor de 38ºC e atraiu famílias inteiras.",createdAt:Date.now()-259200000,publishedAt:Date.now()-259200000,content:`CUIABÁ — Às 5h27 da manhã, quando o termômetro já marcava 29 graus, o locutor anunciou: "Curral sub-30, preparar". Pela primeira vez na história da Corrida de Reis, a mais antiga prova de ano-novo do Brasil fora do eixo Rio-SP, a largada foi feita por pace. Sem elite na frente, sem pelotão único.

Foram 15.023 inscritos, segundo a Secretaria de Esportes, divididos em oito currais: de 3:45/km a 7:30/km. A ideia, importada de Chicago e Berlim, funcionou. O funil da Avenida Historiador Rubens de Mendonça, sempre caótico, fluiu. Menos trombadas, menos corredores caminhando na frente de quem queria voar.

A prova, criada em 1984 por padres salesianos, mantém seu charme interiorano. O kit veio com tereré e chip retornável. Na chegada, no Parque das Águas, havia distribuição de manga colhida na chapada e banho de mangueira para as crianças.

A vencedora no feminino, Jéssica dos Santos, 32, dona de casa e mãe de três, correu de chinelo perdido nos últimos 400m. "Meu pace era 6:10. Entreguei 5:58. Valeu o susto", riu. A organização já confirmou: o modelo de largada por ritmo fica.

E Cuiabá, que sempre sofreu para ser levada a sério no calendário, acabou de ensinar o Brasil a largar melhor. No ano que vem, a meta é 20 mil.`},{id:"c-wtr-2026",title:"WTR ABRE TEMPORADA COM FLORESTA DA TIJUCA E NOVA LIMA NO CIRCUITO",subtitle:"World Trail Races traz MTB e Trail juntos e exige autossuficiência parcial na mata atlântica",category:"TRAIL",date:"08/02/2026",excerpt:"Etapa Rio marca retorno a trilhas originais de 2012. Em Minas, percurso de 32km terá 1.800m de ganho. Inscrições abrem com kit de reflorestamento.",createdAt:Date.now()-172800000,publishedAt:Date.now()-172800000,content:`RIO DE JANEIRO — O barulho de freio a disco voltou a ecoar na Floresta da Tijuca. A World Trail Races (WTR), principal circuito privado de trail do país, anunciou sua temporada 2026 com duas etapas que dividem opinião e elevam a régua técnica: Tijuca (RJ) em março e Nova Lima (MG) em abril, ambas com provas simultâneas de Trail Run e MTB XCM.

No Rio, o percurso de 21km resgata trechos fechados desde 2018: Pedra da Gávea pela Carrasqueira e descida pelo Parque Lage com travessia de riacho. A organização exigirá autossuficiência de 7km entre PCs e lanterna obrigatória, mesmo largando de dia. "A neblina desce rápido. Queremos corredor que saiba se virar", explica a diretora de prova, Letícia Brandão.

Em Nova Lima, o destaque é o ganho: 1.800m positivos em 32km, passando por cavas de mineração desativadas e estradões de eucalipto. Haverá categoria Duo — um corre, outro pedala, revezando em pontos marcados.

O ponto fora da curva é ambiental. Cada inscrição planta três mudas nativas e o atleta leva para casa um "passaporte de trilha" para carimbar. O kit não terá camiseta. "Quem precisa de mais uma camisa de poliamida?", provoca Letícia.

Polêmico, mas coerente com um esporte que nasceu para deixar menos rastro, não mais. Inscrições abrem dia 20 com lote de reflorestamento.`},{id:"d-senta-a-pua",title:"SENTA A PÚA CHEGA À 12ª EDIÇÃO COMO A MAIOR DO CENTRO-OESTE",subtitle:"Chapada dos Guimarães recebe 4.000 atletas entre cânions, areia e 16h de prova para 75km",category:"TRAIL",date:"16-17/05/2026",excerpt:"Prova nascida de resenha de amigos virou peregrinação. Largada noturna, frontal obrigatório e café coado em PC ainda são lei.",createdAt:Date.now()-86400000,publishedAt:Date.now()-86400000,content:`CHAPADA DOS GUIMARÃES — Ninguém chama de Senta a Púa à toa. O nome, gíria de quem aperta o passo na estrada de chão, define os 12 anos da prova que começou com 87 amigos e hoje limita em 4.000 vagas para não degradar o Parque Nacional.

Em 2026, nos dias 16 e 17 de maio, o evento terá cinco distâncias — 7km, 16km, 32km, 55km e 75km — todas com largada entre 4h e 6h da manhã, de frontal na cabeça. O percurso rainha, de 75km, acumula 3.200m de ganho e corta o Morro de São Jerônimo, a Casa de Pedra e o temido Areial do Segredo, um trecho de 4km de areia fofa sob sol de 34ºC onde o pace vai a 9:00/km sem vergonha.

"O Senta a Púa não é para RP", avisa o criador, Seu Dito Guimarães, 61, que ainda confere manualmente cada marcação de cal. A prova mantém tradições analógicas: não há fotos com reconhecimento facial, o número é de tecido e o PC do km 38 serve café coado na hora com pão de queijo.

O que mudou foi a estrutura. Haverá base médica com câmara fria para hipertermia e rastreador via satélite obrigatório nos 55km e 75km. Ainda assim, o regulamento mantém a regra de ouro: "Se encontrar lixo na trilha, mesmo que não seja seu, traga. Se não trouxer, está desclassificado".

No Centro-Oeste, onde trail ainda é sinônimo de aventura solitária, essa é a maior lição que a prova ensina. Inscrições esgotaram em 9 dias.`}],Xn=new Set(_a.map((e)=>e.id));function My(e){if(e<12)return"Bom dia";if(e<18)return"Boa tarde";return"Boa noite"}function Xy(e){let n=String(e.getDate()).padStart(2,"0"),t=String(e.getMonth()+1).padStart(2,"0"),r=e.getFullYear(),l=e.toLocaleDateString("pt-BR",{weekday:"long"}),u=String(e.getHours()).padStart(2,"0"),i=String(e.getMinutes()).padStart(2,"0"),o=String(e.getSeconds()).padStart(2,"0");return{dateLine:`${n}/${t}/${r} — Século XXI — ${l}`,paceLine:`PACE ${u}:${i}:${o}`,rawHour:e.getHours()}}function Zy(e){return e.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}function Jy(e){let n=e.trim();if(n.length<4)return null;let t="";try{let _=new URL(n.startsWith("http")?n:"https://"+n),P=_.pathname.split("/").filter(Boolean);t=P[P.length-1]||P[P.length-2]||_.hostname}catch{let _=n.split("/").filter(Boolean);t=_[_.length-1]||n}if(t=decodeURIComponent(t).replace(/[-_]+/g," ").replace(/\.[a-z0-9]+$/i,"").trim(),!t)t="Nova matéria da redação";let r=t.replace(/\b\w/g,(_)=>_.toUpperCase()),l=Zy(n+" "+t),i=["trail","montanha","trilha","wtr","utmb","senta a pua","chapada","tijuca","nova lima","ultratrail","canyon","canion"].some((_)=>l.includes(_)),o=i?"TRAIL":"RUA",a=new Date,s=a.toLocaleDateString("pt-BR"),h=`gen-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,g=r.toUpperCase(),m=i?`Apuração exclusiva aponta movimento forte em ${r} no cenário off-road`:`Capital e interior aquecem com novidades em ${r} para o calendário de rua`,C=i?`Trilha, altimetria e autossuficiência voltam ao centro do debate. ${r} surge como tema quente entre atletas e organizadores de montanha.`:`Asfalto, multidão e cronômetro. ${r} ganha tração e promete lotar ruas com nova proposta de largada e estrutura ampliada.`,S=`${i?"CHAPADA DOS GUIMARÃES":"SÃO PAULO"} — O link que chegou à redação da RUNNER NEWS apontava apenas para "${n}", ma
