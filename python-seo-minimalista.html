  letter-spacing: -0.025em;
}

.text-\[\#000000\]{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-\[\#333333\]{
  --tw-text-opacity: 1;
  color: rgb(51 51 51 / var(--tw-text-opacity, 1));
}

.text-\[\#333\]{
  --tw-text-opacity: 1;
  color: rgb(51 51 51 / var(--tw-text-opacity, 1));
}

.text-\[\#555\]{
  --tw-text-opacity: 1;
  color: rgb(85 85 85 / var(--tw-text-opacity, 1));
}

.text-\[\#777\]{
  --tw-text-opacity: 1;
  color: rgb(119 119 119 / var(--tw-text-opacity, 1));
}

.text-\[\#FFFFFF\]{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.underline{
  text-decoration-line: underline;
}

.underline-offset-4{
  text-underline-offset: 4px;
}

.shadow-none{
  --tw-shadow: 0 0 #0000;
  --tw-shadow-colored: 0 0 #0000;
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-transform{
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --surface:#FFFFFF;
  --ink:#000000;
  --ink-soft:#111111;
  --line:#E5E5E5;
  --muted:#555555;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
  color-scheme: light;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  background:#FFFFFF;
  color:#000000;
}

body{
  margin:0;
  background:#FFFFFF;
  color:#000000;
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

main, section, header, footer, article, aside, figure, nav, div{
  background-color:#FFFFFF;
}

/* Buttons keep their own black background from the markup; the page itself stays white. */

button{
  font-family:inherit;
}

h1, h2, h3, h4, p, li, dt, dd, span, a{
  color:#000000;
}

a{
  color:#000000;
}

::-moz-selection{
  background:#000000;
  color:#FFFFFF;
}

::selection{
  background:#000000;
  color:#FFFFFF;
}

.tour-highlight{
  box-shadow:0 0 0 2px #000000;
}

.hover\:bg-\[\#000000\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(0 0 0 / var(--tw-bg-opacity, 1));
}

.hover\:underline:hover{
  text-decoration-line: underline;
}

.active\:bg-\[\#000000\]:active{
  --tw-bg-opacity: 1;
  background-color: rgb(0 0 0 / var(--tw-bg-opacity, 1));
}

@media (min-width: 640px){
  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:inline-flex{
    display: inline-flex;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:items-end{
    align-items: flex-end;
  }

  .sm\:justify-between{
    justify-content: space-between;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-20{
    padding-top: 5rem;
    padding-bottom: 5rem;
  }

  .sm\:pb-16{
    padding-bottom: 4rem;
  }

  .sm\:pt-20{
    padding-top: 5rem;
  }

  .sm\:text-\[18px\]{
    font-size: 18px;
  }

  .sm\:text-\[19px\]{
    font-size: 19px;
  }

  .sm\:text-\[40px\]{
    font-size: 40px;
  }

  .sm\:text-\[56px\]{
    font-size: 56px;
  }
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }

  .md\:hidden{
    display: none;
  }
}

@media (min-width: 1024px){
  .lg\:sticky{
    position: sticky;
  }

  .lg\:top-24{
    top: 6rem;
  }

  .lg\:col-span-1{
    grid-column: span 1 / span 1;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.25fr_0\.75fr\]{
    grid-template-columns: 1.25fr 0.75fr;
  }

  .lg\:flex-row{
    flex-direction: row;
  }

  .lg\:items-end{
    align-items: flex-end;
  }

  .lg\:justify-between{
    justify-content: space-between;
  }

  .lg\:text-\[64px\]{
    font-size: 64px;
  }
}
