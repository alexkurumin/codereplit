body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;
}

.font-display{
  font-family:'Share Tech Mono','IBM Plex Mono','Courier New',monospace;
}

.font-body{
  font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;
}

input, textarea, select, button{
  font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;
}

input, textarea, select{
  background:#000;
  color:#fff;
  border:1px solid #fff;
  border-radius:0;
  outline:none;
}

input:focus, textarea:focus, select:focus{
  border-color:#00FF88;
  box-shadow:0 0 0 2px #000, 0 0 18px rgba(0,255,136,.55);
}

input[type="checkbox"]{
  accent-color:#00FF88;
  width:18px;
  height:18px;
  cursor:pointer;
}

input[type="date"]{
  color-scheme:dark;
}

::-moz-selection{
  background:#00FF88;
  color:#000;
}

::selection{
  background:#00FF88;
  color:#000;
}

.scanlines{
  background-image:repeating-linear-gradient(0deg, rgba(0,255,136,.045) 0 1px, transparent 1px 4px);
}

.glow-green{
  text-shadow:0 0 14px rgba(0,255,136,.65), 0 0 32px rgba(0,255,136,.28);
}

.glow-yellow{
  text-shadow:0 0 12px rgba(255,230,0,.45);
}

.text-neon{
  color:#00FF88;
}

.text-yellow{
  color:#FFE600;
}

.text-cyan{
  color:#00E5FF;
}

.border-neon{
  border:1px solid #00FF88;
}

.border-white{
  border:1px solid #fff;
}

.btn{
  border:1px solid #00FF88;
  color:#00FF88;
  background:#000;
  padding:11px 16px;
  font-size:14px;
  line-height:1.4;
  letter-spacing:1px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all .15s;
}

.btn:hover{
  background:#00FF88;
  color:#000;
  box-shadow:0 0 22px rgba(0,255,136,.45);
}

.btn-yellow{
  border-color:#FFE600;
  color:#FFE600;
}

.btn-yellow:hover{
  background:#FFE600;
  color:#000;
  box-shadow:0 0 22px rgba(255,230,0,.4);
}

.btn-red{
  border-color:#FF3B30;
  color:#FF3B30;
}

.btn-red:hover{
  background:#FF3B30;
  color:#000;
  box-shadow:0 0 18px rgba(255,59,48,.45);
}

.btn-white{
  border-color:#fff;
  color:#fff;
}

.btn-white:hover{
  background:#fff;
  color:#000;
}

.tag{
  border:1px solid #00E5FF;
  color:#00E5FF;
  padding:3px 8px;
  font-size:12px;
  letter-spacing:1px;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
}

@media (min-width: 640px){
  .sm\:mt-6{
    margin-top: 1.5rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-\[15px\]{
    font-size: 15px;
  }

  .sm\:tracking-\[3px\]{
    letter-spacing: 3px;
  }
}

@media (min-width: 1024px){
  .lg\:col-span-5{
    grid-column: span 5 / span 5;
  }

  .lg\:col-span-7{
    grid-column: span 7 / span 7;
  }

  .lg\:grid-cols-12{
    grid-template-columns: repeat(12, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
