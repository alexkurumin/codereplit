 celulares, roteadores, satélites e supercomputadores. O Linux não venceu por marketing, mas por um modelo simples: código que pode ser lido, corrigido, melhorado e compartilhado. Essa transparência não elimina erros, mas impede que eles se escondam para sempre atrás de uma caixa-preta.","A lição para quem programa hoje é direta. Bom código não é apenas código que funciona; é código que outros conseguem entender, testar e manter. Documentação clara, commits honestos, testes reais e respeito pelo usuário valem mais do que um truque brilhante que ninguém consegue explicar depois. O Linux cresceu porque milhares de pessoas aceitaram fazer o trabalho invisível: revisar, corrigir, documentar e cuidar.","Celebrar 35 anos do Linux é celebrar uma mentalidade: construir para durar, em vez de construir para impressionar. Se você usa tecnologia todos os dias, experimente também contribuir — nem que seja com uma correção pequena, uma tradução ou uma boa pergunta. A liberdade do código aberto só continua viva quando alguém a exerce com responsabilidade."]},{id:3,title:"Como desligar o ruído digital",date:"2026-11-01",dateLabel:"01 NOV 2026",themes:["MINIMALISMO DIGITAL"],minutes:3,resumo:"O ruído não entra gritando: entra em notificações pequenas. Desligar o excesso é recuperar atenção para o que realmente importa.",conteudo:["O celular vibra, a aba pisca, o feed promete só mais um vídeo. Nenhum estímulo parece grande sozinho, mas juntos eles fragmentam o dia em pedaços tão pequenos que nada profundo consegue acontecer. O ruído digital não rouba apenas tempo; rouba presença. Estamos com o corpo em um lugar e a mente em dez outros.","Minimalismo digital não é odiar tecnologia, e sim dar a ela um lugar definido. Desative o que não serve, tire o aplicativo da tela inicial, marque um horário para checar mensagens e deixe o aparelho fora do quarto à noite. O silêncio no início incomoda, porque revela o que estávamos evitando: tédio, cansaço, saudade, oração. Depois, ele vira espaço para pensar com calma.","Comece por uma regra só: uma hora do dia sem tela, sem exceção. Leia, caminhe, converse, escreva à mão. Você vai perceber que a mente volta a terminar frases e o coração volta a ouvir. A tecnologia é boa serva, mas péssima senhora — e a atenção é um dos bens mais caros que você entrega todos os dias."]},{id:4,title:"Quantum computing: o que muda de verdade",date:"2026-10-25",dateLabel:"25 OUT 2026",themes:["CIÊNCIA","TECNOLOGIA"],minutes:5,resumo:"O computador quântico não é um computador comum mais rápido. Ele muda a pergunta que a máquina sabe responder.",conteudo:["O bit clássico é zero ou um. O qubit vive em superposição e, combinado com outros qubits, permite explorar muitas possibilidades ao mesmo tempo. Na prática, isso não significa abrir planilhas mais rápido. Significa atacar problemas em que o número de combinações explode: descobrir moléculas, otimizar rotas complexas, simular materiais e quebrar certos tipos de criptografia.","Por isso o entusiasmo precisa de sobriedade. Qubits são frágeis, exigem temperaturas extremas e erram com facilidade. Grande parte do trabalho atual não é construir propaganda, mas corrigir erros, estabilizar sistemas e provar utilidade real. A computação quântica avança, mas ainda está longe de substituir o laptop que você usa para escrever, estudar e trabalhar.","O que muda de verdade, desde já, é a responsabilidade. Se a criptografia atual pode enfraquecer no futuro, a segurança precisa ser pensada hoje. Se novos materiais e remédios podem ser simulados, a ética do uso também precisa amadurecer. Tecnologia poderosa sem sabedoria não é progresso: é apenas poder com pressa."]},{id:5,title:"Por que ainda escrevo em caderno de papel",date:"2026-10-18",dateLabel:"18 OUT 2026",themes:["ALEATÓRIO"],minutes:2,resumo:"Sem bateria, sem notificação e sem algoritmo. O caderno me obriga a pensar devagar — e é exatamente por isso que funciona.",conteudo:["No caderno não há como colar, desfazer ou pedir que a máquina termine a frase. A mão cansa, a letra falha, a página fica marcada. E é justamente essa fricção que faz a ideia ficar. Escrever à mão me obriga a escolher palavras, porque não dá para apagar o pensamento com um clique e fingir que ele nunca existiu.","O papel também não me interrompe. Nenhum banner surge no meio de uma oração, nenhuma sugestão tenta adivinhar o que eu quero dizer. O caderno é um dos poucos lugares onde o silêncio ainda é o padrão. Ali, anoto o que não quero esquecer: versículos, ideias ruins, perguntas sem resposta, nomes de pessoas pelas quais preciso orar.","Não sou contra o digital — este blog nasceu dele. Mas o caderno me lembra que nem tudo precisa ser rápido, pesquisável e compartilhável. Algumas coisas precisam ser lentas, pessoais e verdadeiras. Se a sua mente anda barulhenta, experimente uma página em branco. Ela não vai te distrair. Ela vai te esperar."]},{id:6,title:"Fé e código: o que Neemias ensina",date:"2026-10-11",dateLabel:"11 OUT 2026",themes:["FÉ & TECNOLOGIA","CÓDIGO"],minutes:4,resumo:"Neemias não separou oração de planejamento. Ele chorou, mediu o muro, organizou o povo e trabalhou com a espada em uma mão e a ferramenta na outra.",conteudo:["Neemias ouviu sobre o muro caído e chorou. Depois jejuou, orou e pediu ao rei os recursos necessários. A fé dele não foi passiva: ela se transformou em lista, cronograma, equipe e tijolo. É um modelo direto para quem trabalha com tecnologia. Orar não substitui planejar, e planejar não substitui orar. As duas coisas andam juntas.","Quando o povo começou a reconstruir, cada família assumiu um trecho do muro. Ninguém fez tudo sozinho e ninguém ficou olhando. É assim que um bom projeto funciona: responsabilidade clara, trabalho visível, revisão constante e cuidado com quem está ao lado. Código bom, como muro bom, não é feito por heróis isolados, mas por pessoas fiéis no trecho que receberam.","Houve oposição, zombaria e ameaça. Neemias respondeu com vigilância e trabalho: metade vigiava, metade construía. Para quem cria tecnologia hoje, a aplicação é a mesma. Não basta lançar rápido; é preciso proteger, testar, corrigir e sustentar. Fé e código se encontram nesse ponto: construir com excelência aquilo que protege pessoas reais."]},{id:7,title:"O fim dos cookies",date:"2026-10-04",dateLabel:"04 OUT 2026",themes:["TECNOLOGIA","CULTURA"],minutes:3,resumo:"O fim dos cookies de terceiros não é o fim da publicidade — é o fim de um modelo que te seguia pela internet inteira.",conteudo:["Durante anos, um cookie de terceiros acompanhava você de site em site, anotando cliques, interesses e hesitações. O banner de consentimento virou piada: clicamos em aceitar sem ler, só para ver o conteúdo. O resultado foi uma web mais vigiada e, ao mesmo tempo, mais cansada. Privacidade virou um texto longo que ninguém lê.","Com navegadores limitando esse rastreamento, o mercado corre para outras soluções: dados próprios, contextos de página, identificadores disfarçados e inteligência artificial para inferir comportamento. Ou seja, o fim do cookie não garante o fim da vigilância. Ele só muda a técnica. Por isso, a pergunta certa não é qual tecnologia substitui o cookie, mas qual relação queremos ter com quem visita nossos sites.","A saída mais honesta é simples: peça só o dado que você realmente precisa, explique em linguagem clara e respeite o não. Um blog, uma loja ou um projeto pode crescer sem seguir cada passo do visitante. A confiança é um ativo mais lento que o rastreamento — e muito mais difícil de perder quando é construída com verdade."]}],Sm=["INICIO","TECNOLOGIA","FÉ & TECNOLOGIA","ALEATÓRIO","SOBRE"];function bi(){let[e,t]=qe.useState(!1),[n,r]=qe.useState("TODOS"),[o,l]=qe.useState(new Set),i=qe.useRef(null),u=qe.useRef(null),a=qe.useMemo(()=>{let p=new Set;return Ji.forEach((w)=>w.themes.forEach((_)=>p.add(_))),["TODOS",...Array.from(p)]},[]),d=n==="TODOS"?Ji:Ji.filter((p)=>p.themes.includes(n)),h=(p)=>{l((w)=>{let _=new Set(w);if(_.has(p))_.delete(p);else _.add(p);
