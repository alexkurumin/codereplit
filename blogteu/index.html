  background: #000;
  padding: 12px 14px;
  cursor: pointer;
  font-weight: 700;
}

.about-button:hover {
  background: var(--green);
  color: #000;
}

footer {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 20px 40px;
  border-top: 2px solid var(--green);
}

.footer-brand {
  font-family: 'Share Tech Mono', monospace;
  font-size: 28px;
  margin-bottom: 10px;
}

.footer-brand span {
  color: var(--yellow);
  font-size: 17px;
}

footer p {
  font-size: 12px;
  line-height: 1.6;
  letter-spacing: .04em;
  margin: 0 0 8px;
}

.footer-small {
  color: #fff;
}

@media (max-width: 700px) {
  .header-inner {
    padding: 14px 14px 12px;
    gap: 10px;
    align-items: flex-start;
  }

  .logo-mark {
    font-size: 26px;
    padding: 7px 8px 5px;
  }

  .eyebrow {
    font-size: 9px;
  }

  .site-subtitle {
    font-size: 15px;
  }

  .menu-button {
    display: block;
  }

  .main-menu {
    display: none;
    padding: 8px 14px 12px;
  }

  .main-menu.is-open {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
  }

  .menu-link {
    text-align: left;
    padding: 11px 0;
    border-bottom: 1px solid var(--green);
  }

  main {
    padding-left: 14px;
    padding-right: 14px;
  }

  .intro {
    padding-top: 34px;
  }

  .filter-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 6px;
  }

  .post-top time {
    margin-left: 0;
  }

  .filter-button {
    flex: 1 1 42%;
  }

  footer {
    padding-left: 14px;
    padding-right: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}

3,theme:"CÓDIGO",date:"2026-02-05",displayDate:"05 FEV 2026",title:"CÓDIGO LIMPO É UMA FORMA DE RESPEITO",meta:"T.E.U // CÓDIGO // LEITURA 4 MIN",summary:"Código bom não é só código que funciona. É código que outra pessoa consegue ler, entender e manter sem sofrimento.",content:["Nomes claros, funções pequenas e decisões explícitas valem mais do que truques inteligentes. O código será lido muitas vezes; ele deve ser escrito para ser compreendido.","Antes de otimizar, entenda o problema. Antes de abstrair, repita com consciência. Antes de publicar, revise como se fosse você quem precisasse manter aquilo amanhã.","Simplicidade não é falta de ambição. É o resultado de remover tudo o que não precisava estar ali."],tags:["CÓDIGO","CLAREZA","BOAS PRÁTICAS"]},{id:4,theme:"MINIMALISMO DIGITAL",date:"2026-02-01",displayDate:"01 FEV 2026",title:"MENOS NOTIFICAÇÃO, MAIS ATENÇÃO",meta:"T.E.U // MINIMALISMO DIGITAL // LEITURA 3 MIN",summary:"A atenção é um recurso finito. Cada notificação desnecessária é um pequeno roubo de presença — e o roubo se repete o dia inteiro.",content:["Minimalismo digital não é abandonar a tecnologia. É remover o excesso até sobrar apenas o que serve ao trabalho, ao estudo e às relações.","Comece pelo óbvio: desligue o que interrompe sem urgência, tire da tela inicial o que vicia e coloque no lugar o que ajuda.","O objetivo não é ter menos por ter menos. É ter espaço para pensar, criar e descansar sem pedir permissão ao celular."],tags:["ATENÇÃO","FOCO","MINIMALISMO DIGITAL"]},{id:5,theme:"CIÊNCIA",date:"2026-01-28",displayDate:"28 JAN 2026",title:"O MÉTODO É A DISCIPLINA DA CURIOSIDADE",meta:"T.E.U // CIÊNCIA // LEITURA 5 MIN",summary:"A ciência avança quando a pergunta é honesta, o teste é claro e o resultado pode ser contestado sem medo.",content:["Observar, formular uma hipótese, testar e revisar: o método não mata a curiosidade, ele a protege de conclusões apressadas.","Um bom experimento diz o que aconteceu, sob quais condições e o que ainda não sabemos. A incerteza não é falha — é o mapa do próximo passo.","Perguntar bem é tão importante quanto responder bem. A pergunta certa muda o experimento, o dado e a interpretação."],tags:["MÉTODO","CURIOSIDADE","CIÊNCIA"]},{id:6,theme:"CULTURA",date:"2026-01-24",displayDate:"24 JAN 2026",title:"CULTURA DIGITAL: O QUE CONSUMIMOS NOS CONSOME",meta:"T.E.U // CULTURA // LEITURA 4 MIN",summary:"Algoritmos não apenas mostram o mundo: eles moldam o que achamos normal, desejável e urgente.",content:["A cultura digital se forma na repetição. O que aparece todos os dias passa a parecer natural, mesmo quando foi escolhido por um sistema de recomendação.","Por isso, curadoria é uma habilidade essencial: escolher o que ler, quem acompanhar e o que deixar passar é um ato cultural.","Consumir com critério é criar com critério. O que entra pela atenção, mais cedo ou mais tarde, sai pela obra."],tags:["CULTURA","CURADORIA","ATENÇÃO"]},{id:7,theme:"ALEATÓRIO",date:"2026-01-20",displayDate:"20 JAN 2026",title:"O ACASO TAMBÉM ENSINA: NOTAS DE UM CADERNO ABERTO",meta:"T.E.U // ALEATÓRIO // LEITURA 3 MIN",summary:"Nem todo texto precisa de uma tese. Algumas notas existem para registrar uma ideia antes que ela escape.",content:["Anotei esta semana: uma boa ferramenta some quando está em uso; uma má ferramenta pede atenção o tempo todo.","Outra nota: terminar é melhor do que aperfeiçoar para sempre. O rascunho publicado ensina mais do que o perfeito guardado.","E a última: se a tecnologia não deixou o dia mais leve, mais claro ou mais humano, talvez ela não fosse necessária."],tags:["NOTAS","ALEATÓRIO","CADERNO"]}];function km(){let[e,t]=Lt.useState("TODOS"),[n,r]=Lt.useState(!1),[l,o]=Lt.useState("INICIO"),[i,u]=Lt.useState(new Set),s=Lt.useMemo(()=>{if(e==="TODOS")return Fc;return Fc.filter((p)=>p.theme===e)},[e]),c=(p)=>{u((m)=>{let g=new Set(m);if(g.has(p))g.delete(p);else g.add(p);return g})},h=(p)=>{if(o(p),r(!1),p==="TECNOLOGIA")t("TECNOLOGIA");if(p==="FÉ & TECNOLOGIA")t("FÉ & TECN
