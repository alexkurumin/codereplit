<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Diário do Robério</title>
    <meta name="theme-color" content="#0a0e1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-input: #1f2a3e;
            --border-color: #2a3a55;
            --text-primary: #e8edf5;
            --text-secondary: #8899bb;
            --accent-cyan: #00d4ff;
            --accent-blue: #3b82f6;
            --accent-purple: #7c3aed;
            --accent-pink: #ec4899;
            --accent-gold: #fbbf24;
            --accent-green: #34d399;
            --success: #34d399;
            --danger: #f87171;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --appbar-h: 68px;
            --glow-cyan: 0 0 30px rgba(0, 212, 255, 0.15);
            --glow-purple: 0 0 30px rgba(124, 58, 237, 0.15);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.6;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(124, 58, 237, 0.03) 0%, transparent 50%);
        }

        .app-shell {
            width: 100%;
            max-width: 1100px;
            height: 96vh;
            max-height: 920px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow), var(--glow-cyan);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0, 212, 255, 0.15);
            position: relative;
        }

        .app-shell::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(124, 58, 237, 0.05), rgba(236, 72, 153, 0.05));
            z-index: -1;
            pointer-events: none;
        }

        /* ===== TOP BAR ===== */
        .app-bar {
            flex: 0 0 var(--appbar-h);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 20px;
            background: rgba(10, 14, 26, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .app-bar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .app-bar .logo .code-icon {
            display: flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            padding: 6px 10px;
            border-radius: 8px;
            font-family: var(--mono);
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .app-bar .logo .code-icon i {
            font-size: 0.8rem;
        }

        .app-bar .logo .site-name {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-bar .spacer {
            flex: 1;
        }

        .app-bar .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(0, 212, 255, 0.08);
            padding: 4px 12px;
            border-radius: 100px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            font-family: var(--mono);
            letter-spacing: 0.3px;
        }

        .app-bar .status-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .app-bar .toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .app-bar .toolbar button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            position: relative;
        }

        .app-bar .toolbar button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .app-bar .toolbar button.admin-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            padding: 0 18px;
            border-radius: 100px;
            width: auto;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
        }

        .app-bar .toolbar button.admin-btn:hover {
            transform: scale(0.97);
            box-shadow: 0 4px 25px rgba(0, 212, 255, 0.35);
        }

        .app-bar .toolbar button.admin-btn i {
            font-size: 0.85rem;
        }

        .app-bar .toolbar button.admin-btn.logout-btn {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            box-shadow: 0 4px 15px rgba(248, 113, 113, 0.2);
        }

        .app-bar .toolbar button.admin-btn.logout-btn:hover {
            box-shadow: 0 4px 25px rgba(248, 113, 113, 0.35);
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px 20px;
            background: var(--bg-secondary);
        }

        .content .page-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--mono);
            letter-spacing: -0.5px;
        }

        .content .page-title i {
            color: var(--accent-cyan);
            font-size: 1.1rem;
        }

        .content .page-title .highlight {
            color: var(--accent-cyan);
        }

        /* ===== POSTS GRID ===== */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 18px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            opacity: 0;
            transition: var(--transition);
        }

        .post-card:hover::before {
            opacity: 1;
        }

        .post-card:hover {
            border-color: rgba(0, 212, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .post-card .date {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-family: var(--mono);
        }

        .post-card .date i {
            color: var(--accent-cyan);
            margin-right: 4px;
        }

        .post-card .title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-family: var(--mono);
            letter-spacing: -0.3px;
        }

        .post-card .excerpt {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .post-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .post-card .tags span {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.1);
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--accent-cyan);
            font-family: var(--mono);
            letter-spacing: 0.3px;
        }

        .post-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .post-card .card-footer .read-more {
            font-size: 0.7rem;
            color: var(--accent-cyan);
            font-weight: 600;
            font-family: var(--mono);
            letter-spacing: 0.5px;
        }

        .post-card .card-footer .read-more i {
            transition: var(--transition);
        }

        .post-card:hover .card-footer .read-more i {
            transform: translateX(4px);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: var(--radius);
            max-width: 680px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px 36px;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            box-shadow: var(--glow-cyan);
        }

        .modal-overlay.open .modal-box {
            transform: scale(1);
        }

        .modal-box .close-modal {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-box .close-modal:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        .modal-box .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-family: var(--mono);
            letter-spacing: -0.5px;
        }

        .modal-box .modal-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            font-family: var(--mono);
        }

        .modal-box .modal-date i {
            color: var(--accent-cyan);
            margin-right: 6px;
        }

        .modal-box .modal-body p {
            margin-bottom: 14px;
            color: var(--text-primary);
            line-height: 1.7;
        }

        .modal-box .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 14px 0 10px;
        }

        .modal-box .modal-tags span {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.1);
            padding: 2px 12px;
            border-radius: 100px;
            font-size: 0.65rem;
            color: var(--accent-cyan);
            font-family: var(--mono);
        }

        .modal-box .modal-signature {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-style: italic;
            color: var(--accent-gold);
            font-size: 0.9rem;
            font-family: var(--mono);
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .admin-panel.active {
            display: flex;
        }

        .admin-panel .admin-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .admin-panel .sidebar {
            flex: 0 0 200px;
            background: rgba(10, 14, 26, 0.95);
            border-right: 1px solid rgba(0, 212, 255, 0.08);
            padding: 14px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .admin-panel .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            font-family: var(--font);
            position: relative;
        }

        .admin-panel .sidebar .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .admin-panel .sidebar .nav-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        .admin-panel .sidebar .nav-item:hover i {
            color: var(--accent-cyan);
        }

        .admin-panel .sidebar .nav-item.active {
            background: rgba(0, 212, 255, 0.08);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .admin-panel .sidebar .nav-item.active i {
            color: var(--accent-cyan);
        }

        .admin-panel .sidebar .nav-item.danger {
            color: var(--danger);
        }

        .admin-panel .sidebar .nav-item.danger:hover {
            background: rgba(248, 113, 113, 0.08);
        }

        .admin-panel .sidebar .nav-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            margin: 6px 0;
        }

        .admin-panel .admin-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 16px;
            background: var(--bg-secondary);
        }

        /* ===== ADMIN COMPONENTS ===== */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            opacity: 0.5;
        }

        .stat-card .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: var(--mono);
            margin-top: 2px;
        }

        .stat-card .value.cyan { color: var(--accent-cyan); }
        .stat-card .value.gold { color: var(--accent-gold); }
        .stat-card .value.purple { color: var(--accent-purple); }
        .stat-card .value.pink { color: var(--accent-pink); }

        .table-wrap {
            background: var(--bg-card);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-top: 6px;
        }

        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .table-wrap th {
            text-align: left;
            padding: 10px 14px;
            background: rgba(10, 14, 26, 0.6);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.06);
            font-family: var(--mono);
        }

        .table-wrap td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            vertical-align: middle;
        }

        .table-wrap tr:last-child td {
            border-bottom: none;
        }

        .table-wrap .actions {
            display: flex;
            gap: 4px;
        }

        .table-wrap .actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: var(--transition);
        }

        .table-wrap .actions button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        .table-wrap .actions button.danger:hover {
            background: rgba(248, 113, 113, 0.12);
            color: var(--danger);
        }

        .tag-badge {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.15);
            color: var(--accent-purple);
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 100px;
            font-weight: 600;
            display: inline-block;
            margin: 2px 4px 2px 0;
            font-family: var(--mono);
            letter-spacing: 0.3px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-family: var(--mono);
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px 14px;
            background: var(--bg-input);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 0.88rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
            font-family: var(--mono);
            font-size: 0.8rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn {
            padding: 9px 22px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
        }

        .btn-primary:hover {
            transform: scale(0.97);
            box-shadow: 0 4px 25px rgba(0, 212, 255, 0.35);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover {
            background: #2a3a55;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: #fff;
            box-shadow: 0 4px 15px rgba(248, 113, 113, 0.2);
        }

        .btn-danger:hover {
            transform: scale(0.97);
            box-shadow: 0 4px 25px rgba(248, 113, 113, 0.35);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #10b981);
            color: #fff;
            box-shadow: 0 4px 15px rgba(52, 211, 153, 0.2);
        }

        .btn-success:hover {
            transform: scale(0.97);
            box-shadow: 0 4px 25px rgba(52, 211, 153, 0.35);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        /* ===== TAG MANAGEMENT ===== */
        .tag-management {
            background: var(--bg-card);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 16px;
        }

        .tag-management .tag-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .tag-management .tag-input-group input {
            flex: 1;
        }

        .tag-management .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: 100px;
            padding: 4px 12px 4px 14px;
            font-size: 0.75rem;
            font-family: var(--mono);
            margin: 2px 4px 2px 0;
            color: var(--text-primary);
        }

        .tag-item .remove-tag {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.65rem;
            padding: 0 2px;
            transition: var(--transition);
        }

        .tag-item .remove-tag:hover {
            color: #ef4444;
            transform: scale(1.2);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid rgba(0, 212, 255, 0.15);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.85rem;
            box-shadow: var(--shadow), var(--glow-cyan);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
            font-family: var(--mono);
        }

        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== LOGIN ===== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .login-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .login-box {
            background: var(--bg-secondary);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: var(--radius);
            padding: 34px 38px;
            max-width: 380px;
            width: 100%;
            transform: scale(0.92);
            transition: transform 0.3s ease;
            box-shadow: var(--glow-cyan);
        }

        .login-overlay.open .login-box {
            transform: scale(1);
        }

        .login-box .login-icon {
            text-align: center;
            margin-bottom: 16px;
        }

        .login-box .login-icon i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-box h2 {
            font-size: 1.3rem;
            margin-bottom: 4px;
            color: var(--text-primary);
            font-family: var(--mono);
            text-align: center;
        }

        .login-box p {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-box .error-msg {
            color: var(--danger);
            font-size: 0.75rem;
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        .login-box .error-msg.show {
            display: block;
        }

        .login-box .btn {
            width: 100%;
            justify-content: center;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: rgba(0, 212, 255, 0.15);
        }

        .empty-state p {
            font-family: var(--mono);
            font-size: 0.85rem;
        }

        .hidden {
            display: none !important;
        }
